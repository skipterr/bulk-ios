name: Build IPA

on:
  push:
    branches: [main]
  # ручной запуск — это выпуск: сборка уходит в релиз и прилетает обновлением в AltStore
  workflow_dispatch:
    inputs:
      notes:
        description: Что нового
        required: false
        default: Новая версия Булька

permissions:
  contents: write

env:
  BULK_VERSION: 1.${{ github.run_number }}

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      # Рисует иконку (и кадры для превью). Шрифтовые эксперименты (Tools/make_*fonts.py) отключены:
      # на iOS 26 виджет не рисует такие шрифты, анимация теперь через сценарии в BulkScript.
      - name: Render icon and preview frames
        run: |
          xcrun --sdk macosx swiftc -parse-as-library -O -target "$(uname -m)-apple-macos14" \
            Shared/BulkModel.swift Shared/BulkViews.swift Shared/Flipbook.swift Shared/SharedGroup.swift \
            Shared/BulkScript.swift Shared/SharedBridge.swift Shared/SharedKeychain.swift Tools/RenderFrames.swift -o render
          ./render frames App/Assets.xcassets/AppIcon.appiconset/icon.png

      - uses: actions/upload-artifact@v4
        with:
          name: frames-preview
          path: |
            frames/widget.png
            frames/chill_0.png
            frames/dance_3.png
            frames/sleep_0.png
            App/Assets.xcassets/AppIcon.appiconset/icon.png

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project Bulk.xcodeproj -target Bulk -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        run: |
          # вшиваем права на общую память (App Group); Sideloadly переподпишет своим Apple ID
          APP=build/Release-iphoneos/Bulk.app
          # у каждой сборки свой номер: по нему AltStore понимает, что вышло обновление
          for plist in "$APP/Info.plist" "$APP/PlugIns/BulkWidget.appex/Info.plist"; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $BULK_VERSION" "$plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$plist"
          done
          codesign -f -s - --entitlements Widget/BulkWidget.entitlements "$APP/PlugIns/BulkWidget.appex"
          codesign -f -s - --entitlements App/Bulk.entitlements "$APP"
          codesign -d --entitlements - "$APP" || true
          mkdir Payload
          cp -R build/Release-iphoneos/Bulk.app Payload/
          zip -qry Bulk.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Bulk-ipa
          path: Bulk.ipa

      - name: Publish release for AltStore
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          TAG="v$BULK_VERSION"
          python3 Tools/make_source.py "$BULK_VERSION" "$TAG" Bulk.ipa "$NOTES" apps.json
          cp App/Assets.xcassets/AppIcon.appiconset/icon.png icon.png
          gh release create "$TAG" Bulk.ipa apps.json icon.png --title "Бульк $BULK_VERSION" --notes "$NOTES"
