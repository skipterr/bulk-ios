name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Inspect SDK (clock hand rotation)
        run: |
          ls -d /Applications/Xcode*.app
          for X in /Applications/Xcode_26*.app; do
            [ -d "$X" ] || continue
            SDK=$(ls -d "$X"/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS*.sdk | head -1)
            echo "=== $X -> $SDK"
            grep -rlE "[Cc]lockHand" "$SDK/System/Library/Frameworks" 2>/dev/null | head -10 || true
            grep -rh -B2 -A6 "func _clockHandRotationEffect" "$SDK/System/Library/Frameworks" 2>/dev/null | head -40 || true
          done

      - name: Build (unsigned)
        run: |
          xcodebuild -project Bulk.xcodeproj -target Bulk -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/Bulk.app Payload/
          zip -qry Bulk.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Bulk-ipa
          path: Bulk.ipa
