name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Render frames and build sprite fonts
        run: |
          xcrun --sdk macosx swiftc -parse-as-library -O -target "$(uname -m)-apple-macos14" \
            Shared/BulkModel.swift Shared/BulkViews.swift Shared/Flipbook.swift Tools/RenderFrames.swift -o render
          ./render frames App/Assets.xcassets/AppIcon.appiconset/icon.png
          python3 -m venv .venv
          .venv/bin/pip install -q fonttools pillow
          .venv/bin/python Tools/make_fonts.py frames Widget/Fonts
          brew install potrace
          .venv/bin/python Tools/make_layer_fonts.py frames Widget/Fonts
          ls Widget/Fonts | wc -l
          ls -la frames | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: frames-preview
          path: |
            frames/chill_0.png
            frames/dance_3.png
            frames/sleep_0.png
            App/Assets.xcassets/AppIcon.appiconset/icon.png

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          # слои-шрифты (.otf) дописываем в список шрифтов виджета
          for f in Widget/Fonts/*.otf; do
            /usr/libexec/PlistBuddy -c "Add :UIAppFonts: string $(basename "$f")" Widget/Info.plist
          done
          /usr/libexec/PlistBuddy -c "Print :UIAppFonts" Widget/Info.plist | wc -l

      - name: Build (unsigned)
        run: |
          xcodebuild -project Bulk.xcodeproj -target Bulk -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/Bulk.app Payload/
          zip -qry Bulk.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Bulk-ipa
          path: Bulk.ipa
