name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      # Рисует иконку (и кадры для превью). Шрифтовые эксперименты (Tools/make_*fonts.py) отключены:
      # на iOS 26 виджет не рисует такие шрифты, анимация теперь через сценарии в BulkScript.
      - name: Render icon and preview frames
        run: |
          xcrun --sdk macosx swiftc -parse-as-library -O -target "$(uname -m)-apple-macos14" \
            Shared/BulkModel.swift Shared/BulkViews.swift Shared/Flipbook.swift Shared/SharedGroup.swift \
            Shared/BulkScript.swift Tools/RenderFrames.swift -o render
          ./render frames App/Assets.xcassets/AppIcon.appiconset/icon.png

      - uses: actions/upload-artifact@v4
        with:
          name: frames-preview
          path: |
            frames/chill_0.png
            frames/dance_3.png
            frames/sleep_0.png
            App/Assets.xcassets/AppIcon.appiconset/icon.png

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project Bulk.xcodeproj -target Bulk -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        run: |
          # вшиваем права на общую память (App Group); Sideloadly переподпишет своим Apple ID
          APP=build/Release-iphoneos/Bulk.app
          codesign -f -s - --entitlements Widget/BulkWidget.entitlements "$APP/PlugIns/BulkWidget.appex"
          codesign -f -s - --entitlements App/Bulk.entitlements "$APP"
          codesign -d --entitlements - "$APP" || true
          mkdir Payload
          cp -R build/Release-iphoneos/Bulk.app Payload/
          zip -qry Bulk.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Bulk-ipa
          path: Bulk.ipa
