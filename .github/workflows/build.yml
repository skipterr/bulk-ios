name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Inspect SDK (clock hand rotation)
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          grep -rhoE "[A-Za-z_]*[Cc]lockHand[A-Za-z_]*" "$SDK/System/Library/Frameworks" 2>/dev/null | sort | uniq -c | head -40 || true
          grep -rlE "[Cc]lockHand" "$SDK/System/Library/Frameworks" 2>/dev/null | head -20 || true
          grep -rh -B2 -A6 "func _clockHandRotationEffect" "$SDK/System/Library/Frameworks" 2>/dev/null | head -60 || true

      - name: Build (unsigned)
        run: |
          xcodebuild -project Bulk.xcodeproj -target Bulk -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/Bulk.app Payload/
          zip -qry Bulk.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Bulk-ipa
          path: Bulk.ipa
