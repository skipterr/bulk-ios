name: Bulk
options:
  bundleIdPrefix: com.bulk
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  Bulk:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Бульк
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bulk.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BulkWidget
  BulkWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Бульк
        UIAppFonts:
          - BulkChill.ttf
          - BulkWave.ttf
          - BulkSleep.ttf
          - BulkBurp.ttf
          - BulkSwear.ttf
          - BulkDrink.ttf
          - BulkUnscrew.ttf
          - BulkInDark.ttf
          - BulkScrewBack.ttf
          - BulkFixLight.ttf
          - BulkKick.ttf
          - BulkDance.ttf
          - BulkStare.ttf
          - BulkPoked.ttf
          - BulkMad.ttf
          - BulkScared.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bulk.app.widget
        SKIP_INSTALL: "YES"
